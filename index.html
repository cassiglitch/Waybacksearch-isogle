```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #0074d9;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #ff4136;
            text-align: center;
            margin: 20px 0 5px;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 18px;
        }

        .section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 0 15px;
        }

        .navigation {
            margin-top: 10px;
        }

        input[type="text"] {
            width: min(600px, 80vw);
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            outline: none;
        }

        button {
            background-color: #2ecc40;
            color: #fff;
            border: none;
            padding: 12px 18px;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #27ae60;
        }

        button.secondary {
            background-color: #ff4136;
        }

        button.secondary:hover {
            background-color: #d9534f;
        }

        #status {
            text-align: center;
            margin: 14px;
            min-height: 20px;
            font-weight: bold;
        }

        .viewer-container {
            width: 95%;
            height: calc(100vh - 270px);
            min-height: 500px;
            margin: 0 auto 20px;
            background: #fff;
            border-radius: 6px;
            overflow: hidden;
        }

        #viewer {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        .info {
            text-align: center;
            font-size: 13px;
            margin: 8px;
        }

        .divider {
            width: 80%;
            max-width: 900px;
            height: 1px;
            background: rgba(255, 255, 255, 0.35);
            margin: 15px auto;
        }

        @media (max-width: 600px) {

            input[type="text"] {
                width: 100%;
            }

            button {
                flex: 1;
            }

            .viewer-container {
                width: 100%;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <h1>Web Viewer</h1>

    <div class="subtitle">
        Search the web or enter a URL
    </div>


    <!-- =========================
         SEARCH
         ========================= -->

    <div class="section">

        <input
            type="text"
            id="searchInput"
            placeholder="Search the web..."
            autocomplete="off"
            spellcheck="false"
        >

        <button id="searchButton">
            🔎 Search
        </button>

    </div>


    <div class="divider"></div>


    <!-- =========================
         URL BAR
         ========================= -->

    <div class="section navigation">

        <input
            type="text"
            id="urlInput"
            placeholder="https://example.com"
            autocomplete="off"
            spellcheck="false"
        >

        <button id="goButton">
            Go
        </button>

        <button id="backButton">
            ← Back
        </button>

        <button id="forwardButton">
            Forward →
        </button>

        <button id="reloadButton">
            Reload
        </button>

        <button
            id="homeButton"
            class="secondary">
            Home
        </button>

    </div>


    <!-- =========================
         STATUS
         ========================= -->

    <div id="status">
        Ready.
    </div>


    <!-- =========================
         VIEWER
         ========================= -->

    <div class="viewer-container">

        <iframe
            id="viewer"
            title="Web viewer"
            allow="
                autoplay;
                encrypted-media;
                fullscreen;
                picture-in-picture;
            "
            allowfullscreen>
        </iframe>

    </div>


    <div class="info">
        Web pages are displayed inside the viewer when the destination
        permits iframe embedding.
    </div>


<script>

    /*
     * ==========================================
     * ELEMENTS
     * ==========================================
     */

    const searchInput =
        document.getElementById("searchInput");

    const urlInput =
        document.getElementById("urlInput");

    const viewer =
        document.getElementById("viewer");

    const statusBox =
        document.getElementById("status");


    /*
     * ==========================================
     * STATE
     * ==========================================
     */

    let currentURL = "";

    let isYouTube = false;


    /*
     * ==========================================
     * STATUS
     * ==========================================
     */

    function setStatus(message) {
        statusBox.textContent = message;
    }


    /*
     * ==========================================
     * URL NORMALIZATION
     * ==========================================
     */

    function normalizeURL(input) {

        input = input.trim();

        if (!input) {
            return null;
        }


        /*
         * If the user types something that looks
         * like a URL without https://, add it.
         */

        if (!/^https?:\/\//i.test(input)) {

            input =
                "https://" + input;

        }


        try {

            return new URL(input).href;

        } catch {

            return null;

        }
    }


    /*
     * ==========================================
     * YOUTUBE DETECTION
     * ==========================================
     *
     * Supported:
     *
     * youtube.com/watch?v=ID
     * youtu.be/ID
     * youtube.com/shorts/ID
     * youtube.com/embed/ID
     *
     */

    function getYouTubeVideoID(url) {

        try {

            const parsed =
                new URL(url);

            const hostname =
                parsed.hostname.toLowerCase();


            /*
             * youtube.com
             */

            if (
                hostname === "youtube.com" ||
                hostname === "www.youtube.com" ||
                hostname === "m.youtube.com"
            ) {

                /*
                 * Normal video:
                 *
                 * youtube.com/watch?v=VIDEO_ID
                 */

                if (
                    parsed.pathname === "/watch"
                ) {

                    const id =
                        parsed.searchParams.get("v");

                    if (id) {
                        return id;
                    }
                }


                /*
                 * YouTube Shorts
                 */

                if (
                    parsed.pathname.startsWith("/shorts/")
                ) {

                    return parsed.pathname
                        .split("/")[2]
                        ?.split("?")[0]
                        ?.split("&")[0] || null;

                }


                /*
                 * Existing embed URL
                 */

                if (
                    parsed.pathname.startsWith("/embed/")
                ) {

                    return parsed.pathname
                        .split("/")[2]
                        ?.split("?")[0]
                        ?.split("&")[0] || null;

                }

            }


            /*
             * youtu.be
             */

            if (
                hostname === "youtu.be"
            ) {

                return parsed.pathname
                    .split("/")[1]
                    ?.split("?")[0]
                    ?.split("&")[0] || null;

            }

        } catch {

            return null;

        }

        return null;
    }


    /*
     * ==========================================
     * OPEN YOUTUBE
     * ==========================================
     */

    function openYouTube(videoID) {

        isYouTube = true;


        const embedURL =
            "https://www.youtube.com/embed/"
            + encodeURIComponent(videoID)
            + "?autoplay=0";


        currentURL =
            embedURL;


        urlInput.value =
            embedURL;


        setStatus(
            "Loading YouTube video..."
        );


        viewer.src =
            embedURL;
    }


    /*
     * ==========================================
     * LOAD URL
     * ==========================================
     */

    function loadURL(url) {

        /*
         * Check for YouTube first.
         */

        const youtubeID =
            getYouTubeVideoID(url);


        if (youtubeID) {

            openYouTube(
                youtubeID
            );

            return;

        }


        /*
         * Normal webpage.
         */

        isYouTube = false;

        currentURL =
            url;

        urlInput.value =
            url;


        setStatus(
            "Loading " + url
        );


        viewer.src =
            url;
    }


    /*
     * ==========================================
     * GO BUTTON
     * ==========================================
     */

    function openURL() {

        const url =
            normalizeURL(
                urlInput.value
            );


        if (!url) {

            setStatus(
                "Please enter a valid URL."
            );

            return;

        }


        loadURL(url);
    }


    /*
     * ==========================================
     * WEB SEARCH
     * ==========================================
     *
     * Search results are loaded directly into
     * the iframe.
     *
     */

    function webSearch() {

        const query =
            searchInput.value.trim();


        if (!query) {

            setStatus(
                "Enter something to search for."
            );

            return;

        }


        const searchURL =
            "https://www.google.com/search?q="
            + encodeURIComponent(query);


        isYouTube = false;

        currentURL =
            searchURL;


        urlInput.value =
            searchURL;


        setStatus(
            "Loading search results..."
        );


        viewer.src =
            searchURL;
    }


    /*
     * ==========================================
     * BACK
     * ==========================================
     */

    function goBack() {

        try {

            viewer.contentWindow
                .history
                .back();

        } catch {

            setStatus(
                "Back navigation is unavailable for this page."
            );

        }
    }


    /*
     * ==========================================
     * FORWARD
     * ==========================================
     */

    function goForward() {

        try {

            viewer.contentWindow
                .history
                .forward();

        } catch {

            setStatus(
                "Forward navigation is unavailable for this page."
            );

        }
    }


    /*
     * ==========================================
     * RELOAD
     * ==========================================
     */

    function reloadViewer() {

        if (!viewer.src) {
            return;
        }


        const current =
            viewer.src;


        viewer.src =
            "";


        setTimeout(
            function() {

                viewer.src =
                    current;

            },
            50
        );
    }


    /*
     * ==========================================
     * HOME
     * ==========================================
     */

    function goHome() {

        viewer.src =
            "about:blank";


        urlInput.value =
            "";


        currentURL =
            "";


        isYouTube =
            false;


        setStatus(
            "Ready."
        );
    }


    /*
     * ==========================================
     * EVENTS
     * ==========================================
     */

    document
        .getElementById("searchButton")
        .addEventListener(
            "click",
            webSearch
        );


    document
        .getElementById("goButton")
        .addEventListener(
            "click",
            openURL
        );


    document
        .getElementById("backButton")
        .addEventListener(
            "click",
            goBack
        );


    document
        .getElementById("forwardButton")
        .addEventListener(
            "click",
            goForward
        );


    document
        .getElementById("reloadButton")
        .addEventListener(
            "click",
            reloadViewer
        );


    document
        .getElementById("homeButton")
        .addEventListener(
            "click",
            goHome
        );


    /*
     * ==========================================
     * ENTER — SEARCH
     * ==========================================
     */

    searchInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                webSearch();

            }

        }
    );


    /*
     * ==========================================
     * ENTER — URL
     * ==========================================
     */

    urlInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                openURL();

            }

        }
    );


    /*
     * ==========================================
     * IFRAME LOAD
     * ==========================================
     */

    viewer.addEventListener(
        "load",
        function() {

            if (isYouTube) {

                setStatus(
                    "YouTube player loaded."
                );

            } else {

                setStatus(
                    "Page loaded."
                );

            }

        }
    );

</script>

</body>
</html>
