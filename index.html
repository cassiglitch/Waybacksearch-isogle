<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #0074d9;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        h1 {
            color: #ff4136;
            text-align: center;
            margin: 15px 0 10px;
        }

        .toolbar {
            display: flex;
            gap: 6px;
            padding: 6px 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        input {
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            outline: none;
        }

        #urlInput {
            width: min(650px, 70vw);
        }

        #searchInput {
            width: min(500px, 65vw);
        }

        button {
            border: none;
            border-radius: 4px;
            padding: 10px 14px;
            background: #2ecc40;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #27ae60;
        }

        button.red {
            background: #ff4136;
        }

        button.red:hover {
            background: #d9362e;
        }

        #status {
            text-align: center;
            min-height: 22px;
            padding: 5px;
            font-size: 14px;
        }

        #viewerContainer {
            flex: 1;
            width: 100%;
            padding: 0 10px 10px;
            min-height: 0;
        }

        #viewer {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
    </style>
</head>

<body>

    <h1>Web Viewer</h1>

    <!-- SEARCH BAR -->
    <div class="toolbar">

        <input
            id="searchInput"
            type="text"
            placeholder="Search the web..."
            autocomplete="off"
        >

        <button onclick="searchWeb()">
            Search
        </button>

    </div>


    <!-- URL BAR -->
    <div class="toolbar">

        <input
            id="urlInput"
            type="text"
            placeholder="Enter a URL..."
            autocomplete="off"
        >

        <button onclick="goToURL()">
            Go
        </button>

        <button onclick="goBack()">
            ←
        </button>

        <button onclick="goForward()">
            →
        </button>

        <button onclick="reloadPage()">
            Reload
        </button>

        <button
            class="red"
            onclick="home()">
            Home
        </button>

    </div>


    <!-- STATUS -->
    <div id="status">
        Ready
    </div>


    <!-- VIEWER -->
    <div id="viewerContainer">

        <iframe
            id="viewer"
            name="viewerFrame"
            title="Web Viewer"
            allow="fullscreen; autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
        </iframe>

    </div>


<script>

    const viewer =
        document.getElementById("viewer");

    const urlInput =
        document.getElementById("urlInput");

    const searchInput =
        document.getElementById("searchInput");

    const status =
        document.getElementById("status");


    /*
     * ==========================================
     * STATUS
     * ==========================================
     */

    function setStatus(text) {
        status.textContent = text;
    }


    /*
     * ==========================================
     * NORMALIZE URL
     * ==========================================
     */

    function normalizeURL(value) {

        value = value.trim();

        if (!value) {
            return null;
        }

        /*
         * If the user typed a domain without
         * http:// or https://, add https://
         */

        if (!/^https?:\/\//i.test(value)) {
            value = "https://" + value;
        }

        try {
            return new URL(value).href;
        }
        catch {
            return null;
        }
    }


    /*
     * ==========================================
     * YOUTUBE DETECTION
     * ==========================================
     */

    function getYouTubeID(value) {

        try {

            const url =
                new URL(value);

            const host =
                url.hostname.toLowerCase();


            /*
             * youtube.com/watch?v=...
             */

            if (
                host === "youtube.com" ||
                host === "www.youtube.com" ||
                host === "m.youtube.com"
            ) {

                if (url.pathname === "/watch") {

                    return url.searchParams.get("v");

                }


                /*
                 * youtube.com/shorts/ID
                 */

                if (
                    url.pathname.startsWith("/shorts/")
                ) {

                    return url.pathname
                        .split("/")[2]
                        ?.split("?")[0];

                }


                /*
                 * youtube.com/embed/ID
                 */

                if (
                    url.pathname.startsWith("/embed/")
                ) {

                    return url.pathname
                        .split("/")[2]
                        ?.split("?")[0];

                }

            }


            /*
             * youtu.be/ID
             */

            if (host === "youtu.be") {

                return url.pathname
                    .split("/")[1]
                    ?.split("?")[0];

            }

        }
        catch {
            return null;
        }

        return null;
    }


    /*
     * ==========================================
     * LOAD PAGE
     * ==========================================
     */

    function loadPage(url) {

        const youtubeID =
            getYouTubeID(url);


        /*
         * Turn normal YouTube URLs into
         * YouTube's embedded player.
         */

        if (youtubeID) {

            url =
                "https://www.youtube.com/embed/"
                + encodeURIComponent(youtubeID);

            setStatus(
                "Loading YouTube..."
            );

        }
        else {

            setStatus(
                "Loading..."
            );

        }


        urlInput.value =
            url;


        viewer.src =
            url;
    }


    /*
     * ==========================================
     * GO TO URL
     * ==========================================
     */

    function goToURL() {

        const url =
            normalizeURL(
                urlInput.value
            );


        if (!url) {

            setStatus(
                "That isn't a valid URL."
            );

            return;

        }


        loadPage(url);
    }


    /*
     * ==========================================
     * WEB SEARCH
     * ==========================================
     */

    function searchWeb() {

        const query =
            searchInput.value.trim();


        if (!query) {

            setStatus(
                "Enter a search."
            );

            return;

        }


        /*
         * Search is loaded directly into
         * the iframe instead of a new tab.
         */

        const searchURL =
            "https://www.google.com/search?q="
            + encodeURIComponent(query);


        urlInput.value =
            searchURL;


        setStatus(
            "Loading search..."
        );


        viewer.src =
            searchURL;
    }


    /*
     * ==========================================
     * BACK
     * ==========================================
     */

    function goBack() {

        try {

            viewer.contentWindow.history.back();

        }
        catch {

            setStatus(
                "Back navigation unavailable."
            );

        }
    }


    /*
     * ==========================================
     * FORWARD
     * ==========================================
     */

    function goForward() {

        try {

            viewer.contentWindow.history.forward();

        }
        catch {

            setStatus(
                "Forward navigation unavailable."
            );

        }
    }


    /*
     * ==========================================
     * RELOAD
     * ==========================================
     */

    function reloadPage() {

        try {

            viewer.contentWindow.location.reload();

        }
        catch {

            viewer.src =
                viewer.src;

        }
    }


    /*
     * ==========================================
     * HOME
     * ==========================================
     */

    function home() {

        viewer.src =
            "about:blank";

        urlInput.value =
            "";

        setStatus(
            "Ready"
        );
    }


    /*
     * ==========================================
     * FORCE LINKS INTO IFRAME
     * ==========================================
     *
     * This works when the loaded page is
     * accessible under the same-origin rules.
     *
     * It changes:
     *
     * _blank
     * _top
     * _parent
     *
     * into:
     *
     * viewerFrame
     *
     * so the link targets this iframe.
     *
     */

    function forceLinksIntoViewer() {

        try {

            const doc =
                viewer.contentDocument;


            if (!doc) {
                return;
            }


            const links =
                doc.querySelectorAll("a");


            links.forEach(
                function(link) {

                    const target =
                        link.getAttribute("target");


                    if (
                        target === "_blank" ||
                        target === "_top" ||
                        target === "_parent"
                    ) {

                        link.setAttribute(
                            "target",
                            "viewerFrame"
                        );

                    }

                }
            );

        }
        catch {

            /*
             * Cross-origin pages cannot be
             * inspected by the parent page.
             *
             * This is expected browser behavior.
             */

        }

    }


    /*
     * ==========================================
     * IFRAME LOADED
     * ==========================================
     */

    viewer.addEventListener(
        "load",
        function() {

            setStatus(
                "Page loaded."
            );


            /*
             * Try to make links stay in
             * the viewer.
             */

            forceLinksIntoViewer();

        }
    );


    /*
     * ==========================================
     * ENTER KEY — SEARCH
     * ==========================================
     */

    searchInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                searchWeb();

            }

        }
    );


    /*
     * ==========================================
     * ENTER KEY — URL
     * ==========================================
     */

    urlInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                goToURL();

            }

        }
    );


    /*
     * ==========================================
     * START BLANK
     * ==========================================
     */

    viewer.src =
        "about:blank";

</script>

</body>
</html>
