<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bing Web Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #0074d9;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;
        }

        h1 {
            color: #ff4136;
            text-align: center;
            margin: 12px 0 8px;
            font-size: 26px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;

            padding: 5px 10px;
            flex-wrap: wrap;
        }

        input {
            border: none;
            border-radius: 4px;
            padding: 10px 12px;

            font-size: 15px;
            outline: none;
        }

        #searchInput {
            width: min(550px, 65vw);
        }

        #urlInput {
            width: min(700px, 70vw);
        }

        button {
            border: none;
            border-radius: 4px;

            padding: 10px 14px;

            background: #2ecc40;
            color: white;

            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #27ae60;
        }

        button.red {
            background: #ff4136;
        }

        button.red:hover {
            background: #d9362e;
        }

        #status {
            height: 25px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 13px;
        }

        #viewerContainer {
            flex: 1;

            min-height: 0;

            width: 100%;

            padding: 0 8px 8px;
        }

        #viewer {
            display: block;

            width: 100%;
            height: 100%;

            border: none;

            background: white;
        }
    </style>
</head>

<body>

    <h1>Bing Web Viewer</h1>


    <!-- ==============================
         SEARCH BAR
         ============================== -->

    <div class="toolbar">

        <input
            id="searchInput"
            type="text"
            placeholder="Search Bing..."
            autocomplete="off"
            spellcheck="false"
        >

        <button onclick="searchBing()">
            🔎 Search
        </button>

    </div>


    <!-- ==============================
         URL BAR
         ============================== -->

    <div class="toolbar">

        <input
            id="urlInput"
            type="text"
            placeholder="Enter a URL..."
            autocomplete="off"
            spellcheck="false"
        >

        <button onclick="goToURL()">
            Go
        </button>

        <button onclick="goBack()">
            ←
        </button>

        <button onclick="goForward()">
            →
        </button>

        <button onclick="reloadPage()">
            ↻
        </button>

        <button
            class="red"
            onclick="goHome()">
            Home
        </button>

    </div>


    <!-- ==============================
         STATUS
         ============================== -->

    <div id="status">
        Loading Bing...
    </div>


    <!-- ==============================
         IFRAME
         ============================== -->

    <div id="viewerContainer">

        <iframe
            id="viewer"
            name="viewerFrame"
            title="Web Browser"
            allow="
                autoplay;
                fullscreen;
                encrypted-media;
                picture-in-picture
            "
            allowfullscreen>
        </iframe>

    </div>


<script>

    /*
     * ==================================================
     * ELEMENTS
     * ==================================================
     */

    const viewer =
        document.getElementById("viewer");

    const searchInput =
        document.getElementById("searchInput");

    const urlInput =
        document.getElementById("urlInput");

    const status =
        document.getElementById("status");


    /*
     * ==================================================
     * DEFAULT PAGE
     * ==================================================
     */

    const BING_HOME =
        "https://www.bing.com/";


    /*
     * ==================================================
     * STATUS
     * ==================================================
     */

    function setStatus(message) {

        status.textContent =
            message;

    }


    /*
     * ==================================================
     * NORMALIZE URL
     * ==================================================
     */

    function normalizeURL(value) {

        value =
            value.trim();


        if (!value) {
            return null;
        }


        /*
         * If it looks like a search instead
         * of a URL, search Bing.
         */

        if (
            !value.includes("://") &&
            !value.includes(".") &&
            !value.includes("/")
        ) {

            return (
                "https://www.bing.com/search?q=" +
                encodeURIComponent(value)
            );

        }


        /*
         * Add HTTPS when necessary.
         */

        if (
            !/^https?:\/\//i.test(value)
        ) {

            value =
                "https://" + value;

        }


        try {

            return new URL(value).href;

        }
        catch {

            return null;

        }

    }


    /*
     * ==================================================
     * YOUTUBE ID
     * ==================================================
     */

    function getYouTubeID(value) {

        try {

            const url =
                new URL(value);

            const host =
                url.hostname.toLowerCase();


            /*
             * youtube.com
             */

            if (
                host === "youtube.com" ||
                host === "www.youtube.com" ||
                host === "m.youtube.com"
            ) {

                /*
                 * /watch?v=ID
                 */

                if (
                    url.pathname === "/watch"
                ) {

                    return (
                        url.searchParams.get("v")
                    );

                }


                /*
                 * /shorts/ID
                 */

                if (
                    url.pathname.startsWith(
                        "/shorts/"
                    )
                ) {

                    return url.pathname
                        .split("/")[2]
                        ?.split("?")[0]
                        ?.split("&")[0];

                }


                /*
                 * /embed/ID
                 */

                if (
                    url.pathname.startsWith(
                        "/embed/"
                    )
                ) {

                    return url.pathname
                        .split("/")[2]
                        ?.split("?")[0]
                        ?.split("&")[0];

                }

            }


            /*
             * youtu.be/ID
             */

            if (
                host === "youtu.be"
            ) {

                return url.pathname
                    .split("/")[1]
                    ?.split("?")[0]
                    ?.split("&")[0];

            }

        }
        catch {

            return null;

        }


        return null;

    }


    /*
     * ==================================================
     * LOAD URL
     * ==================================================
     */

    function loadURL(url) {

        /*
         * Handle YouTube URLs.
         */

        const youtubeID =
            getYouTubeID(url);


        if (youtubeID) {

            url =
                "https://www.youtube.com/embed/" +
                encodeURIComponent(youtubeID);

            setStatus(
                "Loading YouTube..."
            );

        }
        else {

            setStatus(
                "Loading..."
            );

        }


        urlInput.value =
            url;


        viewer.src =
            url;

    }


    /*
     * ==================================================
     * GO TO URL
     * ==================================================
     */

    function goToURL() {

        const value =
            urlInput.value.trim();


        if (!value) {

            return;

        }


        /*
         * If they typed a normal URL,
         * load it.
         */

        const url =
            normalizeURL(value);


        if (!url) {

            setStatus(
                "Invalid URL."
            );

            return;

        }


        loadURL(url);

    }


    /*
     * ==================================================
     * BING SEARCH
     * ==================================================
     */

    function searchBing() {

        const query =
            searchInput.value.trim();


        if (!query) {

            setStatus(
                "Enter something to search for."
            );

            return;

        }


        const url =
            "https://www.bing.com/search?q=" +
            encodeURIComponent(query);


        urlInput.value =
            url;


        setStatus(
            "Searching Bing..."
        );


        viewer.src =
            url;

    }


    /*
     * ==================================================
     * BACK
     * ==================================================
     */

    function goBack() {

        try {

            viewer.contentWindow
                .history
                .back();

        }
        catch {

            setStatus(
                "Back navigation unavailable."
            );

        }

    }


    /*
     * ==================================================
     * FORWARD
     * ==================================================
     */

    function goForward() {

        try {

            viewer.contentWindow
                .history
                .forward();

        }
        catch {

            setStatus(
                "Forward navigation unavailable."
            );

        }

    }


    /*
     * ==================================================
     * RELOAD
     * ==================================================
     */

    function reloadPage() {

        try {

            viewer.contentWindow
                .location
                .reload();

        }
        catch {

            viewer.src =
                viewer.src;

        }

    }


    /*
     * ==================================================
     * HOME
     * ==================================================
     */

    function goHome() {

        searchInput.value =
            "";

        urlInput.value =
            BING_HOME;

        setStatus(
            "Loading Bing..."
        );

        viewer.src =
            BING_HOME;

    }


    /*
     * ==================================================
     * KEEP LINKS IN THE IFRAME
     * ==================================================
     *
     * This works for pages that the browser allows
     * the parent document to inspect.
     *
     * Links such as:
     *
     * target="_blank"
     * target="_top"
     * target="_parent"
     *
     * are changed to:
     *
     * target="viewerFrame"
     *
     * so they stay inside this iframe.
     *
     * Cross-origin pages cannot be inspected because
     * of the browser's same-origin security rules.
     *
     * Normal links without a target already stay
     * inside the iframe.
     *
     * ==================================================
     */

    function keepLinksInIframe() {

        try {

            const doc =
                viewer.contentDocument;


            if (!doc) {
                return;
            }


            const links =
                doc.querySelectorAll("a");


            links.forEach(
                function(link) {

                    const target =
                        link.getAttribute(
                            "target"
                        );


                    if (
                        target === "_blank" ||
                        target === "_top" ||
                        target === "_parent"
                    ) {

                        link.setAttribute(
                            "target",
                            "viewerFrame"
                        );

                    }

                }
            );


            /*
             * Also watch for links that websites
             * dynamically add after the page loads.
             */

            const observer =
                new MutationObserver(
                    function() {

                        const newLinks =
                            doc.querySelectorAll(
                                "a"
                            );


                        newLinks.forEach(
                            function(link) {

                                const target =
                                    link.getAttribute(
                                        "target"
                                    );


                                if (
                                    target === "_blank" ||
                                    target === "_top" ||
                                    target === "_parent"
                                ) {

                                    link.setAttribute(
                                        "target",
                                        "viewerFrame"
                                    );

                                }

                            }
                        );

                    }
                );


            observer.observe(
                doc.documentElement,
                {
                    childList: true,
                    subtree: true
                }
            );

        }
        catch {

            /*
             * Cross-origin page.
             *
             * We cannot access its DOM.
             * This is intentionally left alone rather
             * than trying to bypass browser security.
             */

        }

    }


    /*
     * ==================================================
     * IFRAME LOAD
     * ==================================================
     */

    viewer.addEventListener(
        "load",
        function() {

            setStatus(
                "Page loaded."
            );


            keepLinksInIframe();


            /*
             * Try to update the URL box for pages
             * where the browser permits access.
             */

            try {

                urlInput.value =
                    viewer.contentWindow
                        .location.href;

            }
            catch {

                /*
                 * Cross-origin pages prevent this.
                 */

            }

        }
    );


    /*
     * ==================================================
     * SEARCH ENTER KEY
     * ==================================================
     */

    searchInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                searchBing();

            }

        }
    );


    /*
     * ==================================================
     * URL ENTER KEY
     * ==================================================
     */

    urlInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                goToURL();

            }

        }
    );


    /*
     * ==================================================
     * START ON BING
     * ==================================================
     */

    viewer.src =
        BING_HOME;

    urlInput.value =
        BING_HOME;

</script>

</body>
</html>
