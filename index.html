```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wayback Machine Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #0074d9;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #ff4136;
            text-align: center;
            margin: 20px 0 5px;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 20px;
        }

        .toolbar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 15px auto;
            padding: 0 15px;
        }

        #urlInput {
            width: min(600px, 80vw);
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            outline: none;
        }

        button {
            background-color: #2ecc40;
            color: #fff;
            border: none;
            padding: 12px 18px;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #27ae60;
        }

        button.secondary {
            background-color: #ff4136;
        }

        button.secondary:hover {
            background-color: #d9534f;
        }

        #status {
            text-align: center;
            margin: 15px;
            min-height: 20px;
            font-weight: bold;
        }

        .viewer-container {
            width: 95%;
            height: calc(100vh - 190px);
            min-height: 500px;
            margin: 0 auto 20px;
            background: white;
            border-radius: 6px;
            overflow: hidden;
        }

        #viewer {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .info {
            text-align: center;
            font-size: 13px;
            margin: 8px;
        }

        @media (max-width: 600px) {

            #urlInput {
                width: 100%;
            }

            button {
                flex: 1;
            }

            .viewer-container {
                width: 100%;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <h1>Wayback Machine Viewer</h1>

    <div class="subtitle">
        Enter a webpage or YouTube URL
    </div>

    <div class="toolbar">

        <input
            type="text"
            id="urlInput"
            placeholder="https://example.com"
            autocomplete="off"
            spellcheck="false"
        >

        <button id="goButton">
            Go
        </button>

        <button id="backButton">
            ← Back
        </button>

        <button id="forwardButton">
            Forward →
        </button>

        <button id="reloadButton">
            Reload
        </button>

        <button
            id="liveButton"
            class="secondary">
            Live Page
        </button>

    </div>

    <div id="status">
        Ready.
    </div>

    <div class="viewer-container">

        <iframe
            id="viewer"
            title="Webpage viewer"
            allow="
                autoplay;
                encrypted-media;
                fullscreen;
                picture-in-picture;
            "
            allowfullscreen>
        </iframe>

    </div>

    <div class="info">
        Archived pages are provided through the Internet Archive's
        Wayback Machine.
    </div>


<script>

    const urlInput = document.getElementById("urlInput");
    const viewer = document.getElementById("viewer");
    const statusBox = document.getElementById("status");

    let currentURL = "";
    let currentWaybackURL = "";
    let isYouTube = false;


    /*
     * Display a status message.
     */
    function setStatus(message) {
        statusBox.textContent = message;
    }


    /*
     * Turn a user-entered URL into a proper URL.
     */
    function normalizeURL(input) {

        input = input.trim();

        if (!input) {
            return null;
        }

        /*
         * Allow users to type things like:
         *
         * example.com
         * youtube.com/watch?v=123
         *
         * without manually typing https://
         */
        if (!/^https?:\/\//i.test(input)) {
            input = "https://" + input;
        }

        try {
            return new URL(input).href;
        } catch {
            return null;
        }
    }


    /*
     * Extract a YouTube video ID.
     *
     * Supported:
     *
     * youtube.com/watch?v=VIDEO_ID
     * youtu.be/VIDEO_ID
     * youtube.com/shorts/VIDEO_ID
     * youtube.com/embed/VIDEO_ID
     */
    function getYouTubeVideoID(url) {

        try {

            const parsed = new URL(url);

            const hostname =
                parsed.hostname.toLowerCase();

            /*
             * Regular YouTube URLs.
             */
            if (
                hostname === "youtube.com" ||
                hostname === "www.youtube.com" ||
                hostname === "m.youtube.com"
            ) {

                /*
                 * /watch?v=...
                 */
                if (parsed.pathname === "/watch") {

                    const videoID =
                        parsed.searchParams.get("v");

                    if (videoID) {
                        return videoID;
                    }
                }


                /*
                 * /shorts/VIDEO_ID
                 */
                if (parsed.pathname.startsWith("/shorts/")) {

                    return parsed.pathname
                        .split("/")[2]
                        ?.split("?")[0]
                        ?.split("&")[0] || null;
                }


                /*
                 * /embed/VIDEO_ID
                 */
                if (parsed.pathname.startsWith("/embed/")) {

                    return parsed.pathname
                        .split("/")[2]
                        ?.split("?")[0]
                        ?.split("&")[0] || null;
                }

            }


            /*
             * youtu.be/VIDEO_ID
             */
            if (hostname === "youtu.be") {

                return parsed.pathname
                    .split("/")[1]
                    ?.split("?")[0]
                    ?.split("&")[0] || null;
            }

        } catch {
            return null;
        }

        return null;
    }


    /*
     * Open a YouTube video using the official
     * embedded player.
     */
    function openYouTube(videoID) {

        isYouTube = true;

        const embedURL =
            "https://www.youtube.com/embed/"
            + encodeURIComponent(videoID)
            + "?autoplay=0";

        currentURL = embedURL;

        currentWaybackURL = "";

        setStatus(
            "YouTube video detected. Loading player..."
        );

        viewer.src = embedURL;
    }


    /*
     * Check the Wayback Machine for an archived
     * version of the requested webpage.
     */
    async function checkWayback(url) {

        const apiURL =
            "https://archive.org/wayback/available?url="
            + encodeURIComponent(url);

        const response =
            await fetch(apiURL);

        if (!response.ok) {
            throw new Error(
                "Wayback request failed."
            );
        }

        const data =
            await response.json();

        if (
            data.archived_snapshots &&
            data.archived_snapshots.closest &&
            data.archived_snapshots.closest.url
        ) {

            return data.archived_snapshots.closest.url;

        }

        return null;
    }


    /*
     * Main Go button.
     */
    async function openURL() {

        const url =
            normalizeURL(urlInput.value);

        if (!url) {

            setStatus(
                "Please enter a valid URL."
            );

            return;
        }


        /*
         * First check whether this is YouTube.
         */
        const youtubeID =
            getYouTubeVideoID(url);

        if (youtubeID) {

            openYouTube(youtubeID);

            return;
        }


        /*
         * Normal webpage.
         */
        isYouTube = false;

        currentURL = url;

        setStatus(
            "Checking the Wayback Machine..."
        );


        try {

            const archivedURL =
                await checkWayback(url);

            if (archivedURL) {

                currentWaybackURL =
                    archivedURL;

                setStatus(
                    "Archived snapshot found. Loading..."
                );

                viewer.src =
                    archivedURL;

            } else {

                currentWaybackURL = "";

                setStatus(
                    "No archived snapshot found. Loading live page..."
                );

                viewer.src =
                    url;
            }

        } catch (error) {

            console.error(error);

            currentWaybackURL = "";

            setStatus(
                "Wayback could not be reached. Loading live page..."
            );

            viewer.src =
                url;
        }
    }


    /*
     * Open the original live URL.
     */
    function openLive() {

        if (!currentURL) {

            const url =
                normalizeURL(urlInput.value);

            if (!url) {

                setStatus(
                    "Enter a URL first."
                );

                return;
            }

            currentURL = url;
        }


        /*
         * Don't accidentally treat a YouTube
         * embed URL as the original page.
         */
        const youtubeID =
            getYouTubeVideoID(currentURL);

        if (youtubeID) {

            openYouTube(youtubeID);

            return;
        }


        isYouTube = false;

        setStatus(
            "Loading live page..."
        );

        viewer.src =
            currentURL;
    }


    /*
     * Reload whatever is currently displayed.
     */
    function reloadViewer() {

        if (!viewer.src) {
            return;
        }

        try {

            viewer.contentWindow.location.reload();

        } catch {

            /*
             * Cross-origin pages prevent direct access
             * to location.reload(), so resetting src
             * is the fallback.
             */
            const current =
                viewer.src;

            viewer.src = "";

            setTimeout(() => {
                viewer.src = current;
            }, 50);
        }
    }


    /*
     * Go backward inside the iframe when possible.
     */
    function goBack() {

        try {

            viewer.contentWindow.history.back();

        } catch {

            setStatus(
                "The embedded page does not allow history control."
            );
        }
    }


    /*
     * Go forward inside the iframe when possible.
     */
    function goForward() {

        try {

            viewer.contentWindow.history.forward();

        } catch {

            setStatus(
                "The embedded page does not allow history control."
            );
        }
    }


    /*
     * Button events.
     */
    document
        .getElementById("goButton")
        .addEventListener(
            "click",
            openURL
        );

    document
        .getElementById("liveButton")
        .addEventListener(
            "click",
            openLive
        );

    document
        .getElementById("backButton")
        .addEventListener(
            "click",
            goBack
        );

    document
        .getElementById("forwardButton")
        .addEventListener(
            "click",
            goForward
        );

    document
        .getElementById("reloadButton")
        .addEventListener(
            "click",
            reloadViewer
        );


    /*
     * Press Enter to navigate.
     */
    urlInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                openURL();
            }

        }
    );


    /*
     * Show errors that occur while loading
     * the iframe itself.
     */
    viewer.addEventListener(
        "load",
        function() {

            if (isYouTube) {
                setStatus("YouTube player loaded.");
            } else {
                setStatus("Page loaded.");
            }

        }
    );

</script>

</body>
</html>
