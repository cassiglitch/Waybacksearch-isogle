```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wayback Machine Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #0074d9;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #ff4136;
            text-align: center;
            margin: 20px 0 5px;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 18px;
        }

        .search-section,
        .navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 0 15px;
        }

        .navigation {
            margin-top: 10px;
        }

        input[type="text"] {
            width: min(600px, 80vw);
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            outline: none;
        }

        button {
            background-color: #2ecc40;
            color: #fff;
            border: none;
            padding: 12px 18px;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #27ae60;
        }

        button.secondary {
            background-color: #ff4136;
        }

        button.secondary:hover {
            background-color: #d9534f;
        }

        button.blue {
            background-color: #0074d9;
            border: 2px solid #fff;
        }

        button.blue:hover {
            background-color: #005fae;
        }

        #status {
            text-align: center;
            margin: 14px;
            min-height: 20px;
            font-weight: bold;
        }

        .viewer-container {
            width: 95%;
            height: calc(100vh - 270px);
            min-height: 500px;
            margin: 0 auto 20px;
            background: #fff;
            border-radius: 6px;
            overflow: hidden;
        }

        #viewer {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        .info {
            text-align: center;
            font-size: 13px;
            margin: 8px;
        }

        .divider {
            width: 80%;
            max-width: 900px;
            height: 1px;
            background: rgba(255,255,255,0.35);
            margin: 15px auto;
        }

        @media (max-width: 600px) {
            input[type="text"] {
                width: 100%;
            }

            button {
                flex: 1;
            }

            .viewer-container {
                width: 100%;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <h1>Wayback Machine Viewer</h1>

    <div class="subtitle">
        Search the web, browse archived pages, or watch YouTube
    </div>


    <!-- =========================
         WEB SEARCH
         ========================= -->

    <div class="search-section">

        <input
            type="text"
            id="searchInput"
            placeholder="Search the web..."
            autocomplete="off"
            spellcheck="false"
        >

        <button id="searchButton">
            🔎 Search
        </button>

    </div>


    <div class="divider"></div>


    <!-- =========================
         URL NAVIGATION
         ========================= -->

    <div class="navigation">

        <input
            type="text"
            id="urlInput"
            placeholder="https://example.com"
            autocomplete="off"
            spellcheck="false"
        >

        <button id="goButton">
            Go
        </button>

        <button id="backButton">
            ← Back
        </button>

        <button id="forwardButton">
            Forward →
        </button>

        <button id="reloadButton">
            Reload
        </button>

        <button
            id="liveButton"
            class="secondary">
            Live Page
        </button>

    </div>


    <!-- =========================
         STATUS
         ========================= -->

    <div id="status">
        Ready.
    </div>


    <!-- =========================
         VIEWER
         ========================= -->

    <div class="viewer-container">

        <iframe
            id="viewer"
            title="Webpage viewer"
            allow="
                autoplay;
                encrypted-media;
                fullscreen;
                picture-in-picture;
            "
            allowfullscreen>
        </iframe>

    </div>


    <div class="info">
        Archived pages are provided through the Internet Archive's
        Wayback Machine.
    </div>


<script>

    /*
     * ==========================================
     * ELEMENTS
     * ==========================================
     */

    const searchInput =
        document.getElementById("searchInput");

    const urlInput =
        document.getElementById("urlInput");

    const viewer =
        document.getElementById("viewer");

    const statusBox =
        document.getElementById("status");


    /*
     * ==========================================
     * STATE
     * ==========================================
     */

    let currentURL = "";

    let currentWaybackURL = "";

    let isYouTube = false;


    /*
     * ==========================================
     * STATUS
     * ==========================================
     */

    function setStatus(message) {

        statusBox.textContent = message;

    }


    /*
     * ==========================================
     * NORMALIZE URL
     * ==========================================
     *
     * Allows:
     *
     * example.com
     * https://example.com
     * youtube.com/watch?v=123
     *
     */

    function normalizeURL(input) {

        input = input.trim();

        if (!input) {
            return null;
        }

        if (!/^https?:\/\//i.test(input)) {

            input =
                "https://" + input;

        }

        try {

            return new URL(input).href;

        } catch {

            return null;

        }
    }


    /*
     * ==========================================
     * YOUTUBE VIDEO DETECTION
     * ==========================================
     *
     * Supports:
     *
     * youtube.com/watch?v=ID
     * www.youtube.com/watch?v=ID
     * m.youtube.com/watch?v=ID
     * youtu.be/ID
     * youtube.com/shorts/ID
     * youtube.com/embed/ID
     *
     */

    function getYouTubeVideoID(url) {

        try {

            const parsed =
                new URL(url);

            const hostname =
                parsed.hostname.toLowerCase();


            /*
             * Regular YouTube domains
             */

            if (
                hostname === "youtube.com" ||
                hostname === "www.youtube.com" ||
                hostname === "m.youtube.com"
            ) {

                /*
                 * /watch?v=VIDEO_ID
                 */

                if (
                    parsed.pathname === "/watch"
                ) {

                    const id =
                        parsed.searchParams.get("v");

                    if (id) {
                        return id;
                    }
                }


                /*
                 * /shorts/VIDEO_ID
                 */

                if (
                    parsed.pathname.startsWith("/shorts/")
                ) {

                    return parsed.pathname
                        .split("/")[2]
                        ?.split("?")[0]
                        ?.split("&")[0] || null;
                }


                /*
                 * /embed/VIDEO_ID
                 */

                if (
                    parsed.pathname.startsWith("/embed/")
                ) {

                    return parsed.pathname
                        .split("/")[2]
                        ?.split("?")[0]
                        ?.split("&")[0] || null;
                }

            }


            /*
             * youtu.be/VIDEO_ID
             */

            if (
                hostname === "youtu.be"
            ) {

                return parsed.pathname
                    .split("/")[1]
                    ?.split("?")[0]
                    ?.split("&")[0] || null;

            }

        } catch {

            return null;

        }

        return null;
    }


    /*
     * ==========================================
     * OPEN YOUTUBE
     * ==========================================
     */

    function openYouTube(videoID) {

        isYouTube = true;

        const embedURL =
            "https://www.youtube.com/embed/"
            + encodeURIComponent(videoID)
            + "?autoplay=0";


        currentURL =
            embedURL;

        currentWaybackURL =
            "";


        setStatus(
            "YouTube video detected. Loading player..."
        );


        viewer.src =
            embedURL;
    }


    /*
     * ==========================================
     * WAYBACK CHECK
     * ==========================================
     */

    async function checkWayback(url) {

        const apiURL =
            "https://archive.org/wayback/available?url="
            + encodeURIComponent(url);


        const response =
            await fetch(apiURL);


        if (!response.ok) {

            throw new Error(
                "Wayback request failed."
            );

        }


        const data =
            await response.json();


        if (
            data.archived_snapshots &&
            data.archived_snapshots.closest &&
            data.archived_snapshots.closest.url
        ) {

            return data
                .archived_snapshots
                .closest
                .url;

        }


        return null;
    }


    /*
     * ==========================================
     * OPEN URL
     * ==========================================
     */

    async function openURL() {

        const url =
            normalizeURL(
                urlInput.value
            );


        if (!url) {

            setStatus(
                "Please enter a valid URL."
            );

            return;
        }


        /*
         * Check for YouTube first.
         */

        const youtubeID =
            getYouTubeVideoID(url);


        if (youtubeID) {

            openYouTube(
                youtubeID
            );

            return;
        }


        /*
         * Normal webpage.
         */

        isYouTube = false;

        currentURL =
            url;


        setStatus(
            "Checking the Wayback Machine..."
        );


        try {

            const archivedURL =
                await checkWayback(url);


            if (archivedURL) {

                currentWaybackURL =
                    archivedURL;


                setStatus(
                    "Archived snapshot found. Loading..."
                );


                viewer.src =
                    archivedURL;

            } else {

                currentWaybackURL =
                    "";


                setStatus(
                    "No archived snapshot found. Loading live page..."
                );


                viewer.src =
                    url;

            }

        } catch (error) {

            console.error(error);


            currentWaybackURL =
                "";


            setStatus(
                "Wayback could not be reached. Loading live page..."
            );


            viewer.src =
                url;
        }
    }


    /*
     * ==========================================
     * LIVE PAGE
     * ==========================================
     */

    function openLive() {

        let url =
            currentURL;


        if (!url) {

            url =
                normalizeURL(
                    urlInput.value
                );

        }


        if (!url) {

            setStatus(
                "Enter a URL first."
            );

            return;
        }


        /*
         * Check for YouTube.
         */

        const youtubeID =
            getYouTubeVideoID(url);


        if (youtubeID) {

            openYouTube(
                youtubeID
            );

            return;
        }


        isYouTube = false;

        currentURL =
            url;


        setStatus(
            "Loading live page..."
        );


        viewer.src =
            url;
    }


    /*
     * ==========================================
     * WEB SEARCH
     * ==========================================
     *
     * The search results are loaded into the
     * existing iframe rather than opening a
     * separate tab.
     *
     */

    function webSearch() {

        const query =
            searchInput.value.trim();


        if (!query) {

            setStatus(
                "Enter something to search for."
            );

            return;
        }


        /*
         * Bing search URL.
         */

        const searchURL =
            "https://www.bing.com/search?q="
            + encodeURIComponent(query);


        isYouTube = false;

        currentURL =
            searchURL;

        currentWaybackURL =
            "";


        setStatus(
            "Loading search results..."
        );


        viewer.src =
            searchURL;
    }


    /*
     * ==========================================
     * RELOAD
     * ==========================================
     */

    function reloadViewer() {

        if (!viewer.src) {
            return;
        }


        const current =
            viewer.src;


        viewer.src =
            "";


        setTimeout(
            function() {

                viewer.src =
                    current;

            },
            50
        );
    }


    /*
     * ==========================================
     * BACK
     * ==========================================
     */

    function goBack() {

        try {

            viewer.contentWindow
                .history
                .back();

        } catch {

            setStatus(
                "The embedded page does not allow history control."
            );

        }
    }


    /*
     * ==========================================
     * FORWARD
     * ==========================================
     */

    function goForward() {

        try {

            viewer.contentWindow
                .history
                .forward();

        } catch {

            setStatus(
                "The embedded page does not allow history control."
            );

        }
    }


    /*
     * ==========================================
     * BUTTON EVENTS
     * ==========================================
     */

    document
        .getElementById("searchButton")
        .addEventListener(
            "click",
            webSearch
        );


    document
        .getElementById("goButton")
        .addEventListener(
            "click",
            openURL
        );


    document
        .getElementById("backButton")
        .addEventListener(
            "click",
            goBack
        );


    document
        .getElementById("forwardButton")
        .addEventListener(
            "click",
            goForward
        );


    document
        .getElementById("reloadButton")
        .addEventListener(
            "click",
            reloadViewer
        );


    document
        .getElementById("liveButton")
        .addEventListener(
            "click",
            openLive
        );


    /*
     * ==========================================
     * SEARCH ENTER KEY
     * ==========================================
     */

    searchInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                webSearch();

            }

        }
    );


    /*
     * ==========================================
     * URL ENTER KEY
     * ==========================================
     */

    urlInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                openURL();

            }

        }
    );


    /*
     * ==========================================
     * IFRAME LOAD
     * ==========================================
     */

    viewer.addEventListener(
        "load",
        function() {

            if (isYouTube) {

                setStatus(
                    "YouTube player loaded."
                );

            } else {

                setStatus(
                    "Page loaded."
                );

            }

        }
    );

</script>

</body>
</html>
